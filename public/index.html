<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Streaming</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        min-height: 100vh;
        color: #ffffff;
        padding: 40px 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
        font-size: 2.5rem;
        background: linear-gradient(90deg, #e94560, #ff6b9d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .video-container {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 20px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      video {
        width: 100%;
        border-radius: 12px;
        background: #000;
      }

      .video-list {
        margin-top: 30px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .video-list h2 {
        font-size: 1.2rem;
        margin-bottom: 15px;
        color: #e94560;
      }

      .video-item {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .video-item:hover {
        background: rgba(233, 69, 96, 0.2);
        transform: translateX(5px);
      }

      .video-item:last-child {
        margin-bottom: 0;
      }

      .video-icon {
        margin-right: 12px;
        font-size: 1.5rem;
      }

      .video-name {
        flex: 1;
      }

      .video-link {
        color: #e94560;
        text-decoration: none;
        font-size: 0.85rem;
        padding: 6px 12px;
        background: rgba(233, 69, 96, 0.15);
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      .video-link:hover {
        background: rgba(233, 69, 96, 0.3);
      }

      .no-videos {
        color: #888;
        text-align: center;
        padding: 20px;
      }

      .instructions {
        margin-top: 30px;
        padding: 20px;
        background: rgba(233, 69, 96, 0.1);
        border-radius: 12px;
        border-left: 4px solid #e94560;
      }

      .instructions h3 {
        margin-bottom: 10px;
        color: #e94560;
      }

      .instructions code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 8px;
        border-radius: 4px;
        font-family: "Fira Code", monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- <h1>🎬 Video Streaming</h1> -->


       <video id="player" controls src="/video/video.mp4">
          <source src="" type="video/mp4" />
          Your browser does not support the video tag.
        </video>

      <!-- <div class="video-container">
        <video id="player" controls>
          <source src="" type="video/mp4" />

      </div>

      <div class="video-list">
        <h2>📁 Available Videos</h2>
        <div id="videoList">
          <div class="no-videos">Loading...</div>

                    </div>
                `
            )
            .join("");

          playVideo(data.videos[0]);

          videoList.innerHTML =
            '<div class="no-videos">Error loading videos</div>';

  </body>
</html>
